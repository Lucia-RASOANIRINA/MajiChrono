org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Compilation incrementale Kotlin desactivee : sur Windows, la fermeture des
# caches `.tab` echoue de facon intermittente (verrouillage de fichier par
# l'antivirus ou le demon Kotlin) et fait echouer le build entier. Le cout est
# quelques dizaines de secondes par compilation propre ; le gain est un build
# reproductible, condition de la chaine de livraison du §16.3.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
