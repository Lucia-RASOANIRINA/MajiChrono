name: majichrono
description: "MajiChrono - plateforme de livraison a la demande (Madagascar)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Etat / navigation / injection ---
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2

  # --- Immuabilite / serialisation ---
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # --- Reseau ---
  dio: ^5.7.0

  # --- Persistance ---
  drift: ^2.22.1
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # --- Socle ---
  connectivity_plus: ^6.1.0
  logger: ^2.5.0
  intl: any
  uuid: ^4.5.1
  collection: ^1.18.0
  package_info_plus: ^8.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3
  drift_dev: ^2.22.1

flutter:
  uses-material-design: true
  generate: true
